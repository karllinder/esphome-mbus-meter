esphome:
  name: mbus-meter-esp8266-ard

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: ../components

uart:
  id: uart_bus
  rx_pin: GPIO4
  tx_pin: GPIO5
  baud_rate: 2400
  rx_buffer_size: 2048

mbus_meter:
  id: mbus_reader
  uart_id: uart_bus

sensor:
  - platform: mbus_meter
    id: mbus_reader
    power:
      name: Power
    current_l1:
      name: Current L1
    current_l2:
      name: Current L2
    current_l3:
      name: Current L3
    voltage_l1:
      name: Voltage L1
    voltage_l2:
      name: Voltage L2
    voltage_l3:
      name: Voltage L3
    energy:
      name: Energy
    export_energy:
      name: Export Energy
    reactive_power:
      name: Reactive Power
    reactive_energy:
      name: Reactive Energy
    reactive_export_energy:
      name: Reactive Export Energy

text_sensor:
  - platform: mbus_meter
    id: mbus_reader
    obis_version:
      name: OBIS Version
    meter_id:
      name: Meter ID
    meter_type:
      name: Meter Type
    meter_time:
      name: Meter Time
